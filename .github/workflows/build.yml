name: Build and release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Check source and release version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate versions
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('daemon/Cargo.toml').read_text())['package']['version']
          makefile = Path('portalkeeper/Makefile').read_text()
          match = re.search(r'^PKG_VERSION\s*:=\s*(\S+)', makefile, re.M)
          if not match or match[1] != version:
              raise SystemExit(f'Cargo and OpenWrt package versions disagree ({version})')
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit(f'Release tag must be v{version}')
          print(f'PortalKeeper v{version}')
          PY

      - name: Check LuCI and packaging scripts
        run: |
          node --check portalkeeper/htdocs/luci-static/resources/view/portalkeeper/overview.js
          python3 -m json.tool portalkeeper/usr/share/luci/menu.d/portalkeeper.json >/dev/null
          python3 -m json.tool portalkeeper/usr/share/rpcd/acl.d/portalkeeper.json >/dev/null
          bash -n build/build-apk.sh
          bash -n build/build-ipk.sh

      - name: Install Rust and lint tools
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt

      - name: Check Rust formatting
        run: cargo +stable fmt --manifest-path daemon/Cargo.toml --check

      - name: Run Rust tests
        run: cargo +stable test --locked --manifest-path daemon/Cargo.toml

      - name: Run Clippy
        run: cargo +stable clippy --locked --manifest-path daemon/Cargo.toml --all-targets -- -D warnings

  build:
    name: Package ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64_cortex-a53
            target: aarch64-unknown-linux-musl
            image: aarch64-musl
          - arch: arm_cortex-a7
            target: armv7-unknown-linux-musleabihf
            image: armv7-musleabihf
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            image: x86_64-musl
          - arch: mipsel_24kc
            target: mipsel-unknown-linux-musl
            image: mipsel-musl

    env:
      PACKAGE_ARCH: ${{ matrix.arch }}
      RUST_TARGET: ${{ matrix.target }}
      CROSS_IMAGE: ghcr.io/rust-cross/rust-musl-cross:${{ matrix.image }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and check the static binary
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/home/rust/src" \
            --workdir /home/rust/src/daemon \
            "$CROSS_IMAGE" \
            bash -euc 'cargo build --locked --release --target "$1" --config "target.$1.linker=\"$TARGET_CC\""' _ "$RUST_TARGET"

          binary="daemon/target/$RUST_TARGET/release/portalkeeperd"
          test -s "$binary"
          headers="$(readelf -lW "$binary")"
          dynamic="$(readelf -dW "$binary")"
          if grep -q ' INTERP ' <<< "$headers" || grep -q '(NEEDED)' <<< "$dynamic"; then
            echo "::error::portalkeeperd must be statically linked"
            exit 1
          fi

      - name: Get APK tooling from Alpine stable
        shell: bash
        run: |
          docker pull alpine:3.23
          docker run --rm --pull=never alpine:3.23 sh -ec \
            'apk add --no-cache apk-tools-static >&2; exec cat /sbin/apk.static' \
            > "$RUNNER_TEMP/apk.static"
          chmod +x "$RUNNER_TEMP/apk.static"
          "$RUNNER_TEMP/apk.static" --version

      - name: Build APK and IPK packages
        shell: bash
        run: |
          binary="daemon/target/$RUST_TARGET/release/portalkeeperd"
          sudo env "ARCH=$PACKAGE_ARCH" "APK=$RUNNER_TEMP/apk.static" bash build/build-apk.sh "$binary"
          ARCH="$PACKAGE_ARCH" bash build/build-ipk.sh "$binary"

          shopt -s nullglob
          apk=(build/out-apk/*_"$PACKAGE_ARCH".apk)
          ipk=(build/out/*_"$PACKAGE_ARCH".ipk)
          [[ ${#apk[@]} -eq 1 && ${#ipk[@]} -eq 1 ]]
          test -s "${apk[0]}"
          test -s "${ipk[0]}"
          mkdir -p build/release
          cp -- "${apk[0]}" "${ipk[0]}" build/release/

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: portalkeeper-${{ matrix.arch }}
          path: build/release/
          if-no-files-found: error

  release:
    name: Publish the official release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: portalkeeper-*
          path: dist
          merge-multiple: true

      - name: Check both formats for every target
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for arch in aarch64_cortex-a53 arm_cortex-a7 x86_64 mipsel_24kc; do
            test -s "dist/portalkeeper_$version-r1_$arch.apk"
            test -s "dist/portalkeeper_$version-1_$arch.ipk"
          done

      - name: Publish packages
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.apk
            dist/*.ipk
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
